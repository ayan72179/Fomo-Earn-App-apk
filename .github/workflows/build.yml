          package com.fomo.earn;

          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.Button;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          public class PermissionSetupActivity extends AppCompatActivity {

              private TextView tv1, tv2, tv3, tv4;
              private Button btnStartWatching;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_permission_setup);

                  tv1 = findViewById(R.id.tvStatus1);
                  tv2 = findViewById(R.id.tvStatus2);
                  tv3 = findViewById(R.id.tvStatus3);
                  tv4 = findViewById(R.id.tvStatus4);
                  btnStartWatching = findViewById(R.id.btnStartWatchingSetup);

                  findViewById(R.id.btnGrant1).setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  findViewById(R.id.btnGrant2).setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()))));
                  findViewById(R.id.btnGrant3).setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:" + getPackageName()))));
                  findViewById(R.id.btnGrant4).setOnClickListener(v -> {
                      Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                      intent.setData(Uri.parse("package:" + getPackageName()));
                      startActivity(intent);
                  });

                  btnStartWatching.setOnClickListener(v -> finish());
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refreshUI();
              }

              private void refreshUI() {
                  boolean p1 = MainActivity.isAccessibilityServiceEnabled(this, AutoWatchService.class);
                  boolean p2 = Settings.canDrawOverlays(this);
                  boolean p3 = Settings.System.canWrite(this);
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  boolean p4 = pm != null && pm.isIgnoringBatteryOptimizations(getPackageName());

                  updateText(tv1, p1, "Lets the app watch the video and count for you.");
                  updateText(tv2, p2, "Shows the countdown timer on top of YouTube.");
                  updateText(tv3, p3, "Keeps the screen awake during a watch.");
                  updateText(tv4, p4, "Stops the system from killing the watch mid-task.");

                  if (p1 && p2 && p3 && p4) {
                      btnStartWatching.setVisibility(View.VISIBLE);
                  } else {
                      btnStartWatching.setVisibility(View.GONE);
                  }
              }

              private void updateText(TextView tv, boolean ok, String defaultDesc) {
                  if (ok) {
                      tv.setText("✓ Permission Granted");
                      tv.setTextColor(Color.parseColor("#10B981"));
                  } else {
                      tv.setText(defaultDesc);
                      tv.setTextColor(Color.parseColor("#9CA3AF"));
                  }
              }
          }
