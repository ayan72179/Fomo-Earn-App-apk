                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".SplashActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="false" />

                  <activity
                      android:name=".PermissionSetupActivity"
                      android:exported="false" />

                  <service
                      android:name=".AutoWatchService"
                      android:exported="true"
                      android:label="Farmo Watch Assistant"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          # SplashActivity.java
          cat << 'EOF' > app/src/main/java/com/fomo/earn/SplashActivity.java
          package com.fomo.earn;

          import android.annotation.SuppressLint;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import androidx.appcompat.app.AppCompatActivity;

          @SuppressLint("CustomSplashScreen")
          public class SplashActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_splash);

                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      startActivity(new Intent(SplashActivity.this, MainActivity.class));
                      finish();
                  }, 1500);
              }
          }
          EOF

          # MainActivity.java (Strict Hardware Permission Validation & Direct YouTube App Intent)
          cat << 'EOF' > app/src/main/java/com/fomo/earn/MainActivity.java
          package com.fomo.earn;

          import android.annotation.SuppressLint;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              public static final String APP_URL = "http://zaicash.gamer.gd/index.php?app=1";
              private WebView webView;
              private boolean isPageFinished = false;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.mainWebView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.addJavascriptInterface(new AndroidBridge(this), "AndroidBridge");
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("intent:") || url.startsWith("vnd.youtube:")) {
                              try {
                                  Intent intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(intent);
                              } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          isPageFinished = true;
                          syncPermissionsToWeb();
                      }
                  });

                  webView.loadUrl(APP_URL);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (isPageFinished) {
                      syncPermissionsToWeb();
                  }
              }

              public boolean areAllPermissionsGranted() {
                  boolean p1 = isAccessibilityServiceEnabled(this, AutoWatchService.class);
                  boolean p2 = Settings.canDrawOverlays(this);
                  boolean p3 = Settings.System.canWrite(this);
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  boolean p4 = pm != null && pm.isIgnoringBatteryOptimizations(getPackageName());
                  return p1 && p2 && p3 && p4;
              }

              public void syncPermissionsToWeb() {
                  boolean p1 = isAccessibilityServiceEnabled(this, AutoWatchService.class);
                  boolean p2 = Settings.canDrawOverlays(this);
                  boolean p3 = Settings.System.canWrite(this);
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  boolean p4 = pm != null && pm.isIgnoringBatteryOptimizations(getPackageName());

                  String js = "(function() {" +
                          "if (typeof grantedPerms !== 'undefined') {" +
                          "  grantedPerms[1] = " + p1 + ";" +
                          "  grantedPerms[2] = " + p2 + ";" +
                          "  grantedPerms[3] = " + p3 + ";" +
                          "  grantedPerms[4] = " + p4 + ";" +
                          "  function update(id, ok) {" +
                          "    var b = document.getElementById('p-btn-' + id);" +
                          "    if (b) {" +
                          "      b.innerText = ok ? 'Granted ✓' : 'Grant';" +
                          "      b.className = ok ? 'px-3.5 py-1.5 rounded-xl text-xs font-bold bg-green-500/20 text-green-300 border border-green-500/40' : 'px-3.5 py-1.5 rounded-xl text-xs font-bold bg-purple-700 text-purple-200';" +
                          "    }" +
                          "  }" +
                          "  update(1, " + p1 + ");" +
                          "  update(2, " + p2 + ");" +
                          "  update(3, " + p3 + ");" +
                          "  update(4, " + p4 + ");" +
                          "}" +
                          "})();";

                  webView.post(() -> webView.evaluateJavascript(js, null));
              }

              public static boolean isAccessibilityServiceEnabled(Context context, Class<?> service) {
                  ComponentName expectedComponentName = new ComponentName(context, service);
                  String enabledServicesSetting = Settings.Secure.getString(
                          context.getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  );
                  if (enabledServicesSetting == null) return false;
                  TextUtils.SimpleStringSplitter colonSplitter = new TextUtils.SimpleStringSplitter(':');
                  colonSplitter.setString(enabledServicesSetting);
                  while (colonSplitter.hasNext()) {
                      String componentNameString = colonSplitter.next();
                      ComponentName enabledService = ComponentName.unflattenFromString(componentNameString);
                      if (enabledService != null && enabledService.equals(expectedComponentName)) {
                          return true;
                      }
                  }
                  return false;
              }

              public class AndroidBridge {
                  private final Context context;

                  public AndroidBridge(Context context) {
                      this.context = context;
                  }

                  @JavascriptInterface
                  public void checkPermissions() {
                      runOnUiThread(() -> syncPermissionsToWeb());
                  }

                  @JavascriptInterface
                  public boolean checkAllPermissionsGranted() {
                      return areAllPermissionsGranted();
                  }

                  @JavascriptInterface
                  public void requestPerm(int step) {
                      try {
                          switch (step) {
                              case 1:
                                  startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                                  break;
                              case 2:
                                  startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                                  break;
                              case 3:
                                  startActivity(new Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:" + getPackageName())));
                                  break;
                              case 4:
                                  Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                                  intent.setData(Uri.parse("package:" + getPackageName()));
                                  startActivity(intent);
                                  break;
                          }
                      } catch (Exception ignored) {}
                  }

                  // STRICT LAUNCH: Only launches YouTube if ALL 4 permissions are TRULY allowed!
                  @JavascriptInterface
                  public void launchAutoWatch(String videoId, int taskId) {
                      runOnUiThread(() -> {
                          if (!areAllPermissionsGranted()) {
                              Toast.makeText(context, "Please allow all 4 permissions first!", Toast.LENGTH_SHORT).show();
                              startActivity(new Intent(context, PermissionSetupActivity.class));
                              return;
                          }

                          AutoWatchService.startWatch(context, videoId, taskId);

                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse("vnd.youtube:" + videoId));
                          intent.setPackage("com.google.android.youtube");
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);

                          try {
                              context.startActivity(intent);
                          } catch (Exception e) {
                              Intent web = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/watch?v=" + videoId));
                              web.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              context.startActivity(web);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void stopAutoWatch() {
                      AutoWatchService.stopAutoWatch();
                  }
              }
          }
          EOF

