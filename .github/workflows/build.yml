          # AutoWatchService.java (Reliable Reverse Countdown 15s -> 0s & Fixed YouTube Ad Detection)
          cat << 'EOF' > app/src/main/java/com/fomo/earn/AutoWatchService.java
          package com.fomo.earn;

          import android.accessibilityservice.AccessibilityService;
          import android.annotation.SuppressLint;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.PixelFormat;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.webkit.CookieManager;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONObject;

          import java.io.IOException;
          import java.util.concurrent.TimeUnit;

          import okhttp3.Call;
          import okhttp3.Callback;
          import okhttp3.FormBody;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;
          import okhttp3.ResponseBody;

          public class AutoWatchService extends AccessibilityService {

              private static final String YOUTUBE_PACKAGE = "com.google.android.youtube";
              public static boolean isAutoRunning = false;
              public static String currentVideoId = "";
              public static int currentTaskId = 0;
              public static final String BASE_URL = "http://zaicash.gamer.gd/index.php";

              private WindowManager windowManager;
              private View overlayView;
              private TextView timerText;

              private Handler handler;
              private Runnable timerRunnable;
              private int remainingSeconds = 15;
              private boolean isCounting = false;
              private boolean isAdDetected = false;
              private boolean isVideoPaused = false;

              private OkHttpClient httpClient;
              public static AutoWatchService instance;

              public static void startWatch(Context context, String videoId, int taskId) {
                  isAutoRunning = true;
                  currentVideoId = videoId;
                  currentTaskId = taskId;

                  if (instance != null) {
                      new Handler(Looper.getMainLooper()).post(() -> instance.showOverlayDirectly());
                  }
              }

              public static void stopAutoWatch() {
                  isAutoRunning = false;
                  currentVideoId = "";
                  currentTaskId = 0;
                  if (instance != null) {
                      new Handler(Looper.getMainLooper()).post(() -> instance.hideOverlayDirectly());
                  }
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  handler = new Handler(Looper.getMainLooper());
                  httpClient = new OkHttpClient.Builder()
                          .connectTimeout(15, TimeUnit.SECONDS)
                          .readTimeout(15, TimeUnit.SECONDS)
                          .build();
              }

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  try {
                      windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                      setupOverlay();
                  } catch (Exception ignored) {}
              }

              public void showOverlayDirectly() {
                  if (overlayView == null) setupOverlay();
                  if (overlayView != null) {
                      overlayView.setVisibility(View.VISIBLE);
                      remainingSeconds = 15;
                      if (timerText != null) timerText.setText("15s");
                      startCountdown();
                  }
              }

              public void hideOverlayDirectly() {
                  pauseTimer();
                  if (overlayView != null) overlayView.setVisibility(View.GONE);
              }

              @SuppressLint("InflateParams")
              private void setupOverlay() {
                  if (overlayView != null || !Settings.canDrawOverlays(this)) return;

                  int layoutType = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE;

                  WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          layoutType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                          PixelFormat.TRANSLUCENT
                  );
                  params.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  params.y = 80;

                  try {
                      overlayView = LayoutInflater.from(this).inflate(R.layout.overlay_timer, null);
                      timerText = overlayView.findViewById(R.id.tvPillText);
                      overlayView.setVisibility(View.GONE);
                      windowManager.addView(overlayView, params);
                  } catch (Exception e) {
                      overlayView = null;
                  }
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (!isAutoRunning || currentVideoId.isEmpty()) {
                      hideOverlayDirectly();
                      return;
                  }

                  if (event == null || event.getPackageName() == null) return;
                  String pkg = event.getPackageName().toString();

                  if (YOUTUBE_PACKAGE.equals(pkg)) {
                      if (overlayView == null) setupOverlay();
                      if (overlayView != null && overlayView.getVisibility() != View.VISIBLE) {
                          overlayView.setVisibility(View.VISIBLE);
                      }

                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      inspectPlayback(root);

                      if (isAdDetected) {
                          pauseTimer();
                          if (timerText != null) timerText.setText("Ad...");
                      } else if (isVideoPaused) {
                          pauseTimer();
                          if (timerText != null) timerText.setText("Paused");
                      } else {
                          if (!isCounting) {
                              startCountdown();
                          }
                      }
                  } else {
                      pauseTimer();
                      if (overlayView != null) overlayView.setVisibility(View.GONE);
                  }
              }

              private void inspectPlayback(AccessibilityNodeInfo node) {
                  if (node == null) return;
                  isAdDetected = checkStrictAdButton(node);
                  isVideoPaused = checkPauseButton(node);
              }

              // STRICT Ad Detection: Only matches real Skip Ad and Video ad indicators
              private boolean checkStrictAdButton(AccessibilityNodeInfo node) {
                  if (node == null) return false;
                  CharSequence text = node.getText();
                  CharSequence desc = node.getContentDescription();

                  if (text != null) {
                      String s = text.toString().toLowerCase().trim();
                      if (s.equals("skip ad") || s.equals("skip ads") || s.startsWith("ad 1 of") || s.startsWith("ad 2 of") || s.contains("video will play after ad")) {
                          return true;
                      }
                  }
                  if (desc != null) {
                      String s = desc.toString().toLowerCase().trim();
                      if (s.equals("skip ad") || s.equals("skip ads") || s.startsWith("ad 1 of") || s.startsWith("ad 2 of")) {
                          return true;
                      }
                  }

                  for (int i = 0; i < node.getChildCount(); i++) {
                      if (checkStrictAdButton(node.getChild(i))) return true;
                  }
                  return false;
              }

              private boolean checkPauseButton(AccessibilityNodeInfo node) {
                  if (node == null) return false;
                  CharSequence desc = node.getContentDescription();
                  if (desc != null && desc.toString().equalsIgnoreCase("play video")) {
                      return true;
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      if (checkPauseButton(node.getChild(i))) return true;
                  }
                  return false;
              }

              private void startCountdown() {
                  isCounting = true;
                  if (timerRunnable != null) handler.removeCallbacks(timerRunnable);

                  timerRunnable = new Runnable() {
                      @Override
                      public void run() {
                          if (!isCounting || !isAutoRunning) return;

                          // REVERSE COUNTDOWN: 15s -> 14s -> 13s -> ... -> 0s
                          remainingSeconds--;
                          if (timerText != null) timerText.setText(remainingSeconds + "s");

                          if (remainingSeconds <= 0) {
                              pauseTimer();
                              remainingSeconds = 15;

                              if (timerText != null) timerText.setText("🎉 +$0.00040");

                              new Handler(Looper.getMainLooper()).post(() -> {
                                  Toast.makeText(getApplicationContext(), "🎉 Reward Added! Loading next video...", Toast.LENGTH_SHORT).show();
                              });

                              claimRewardAndOpenNext();
                              return;
                          }

                          handler.postDelayed(this, 1000);
                      }
                  };
                  handler.postDelayed(timerRunnable, 1000);
              }

              private void pauseTimer() {
                  isCounting = false;
                  if (timerRunnable != null) handler.removeCallbacks(timerRunnable);
              }

              private void claimRewardAndOpenNext() {
                  String cookie = CookieManager.getInstance().getCookie(BASE_URL);
                  FormBody.Builder form = new FormBody.Builder()
                          .add("task_id", String.valueOf(currentTaskId));

                  Request.Builder req = new Request.Builder()
                          .url(BASE_URL + "?api=claim_reward")
                          .post(form.build());

                  if (cookie != null) req.addHeader("Cookie", cookie);

                  httpClient.newCall(req.build()).enqueue(new Callback() {
                      @Override
                      public void onFailure(Call call, IOException e) {
                          fetchAndLaunchNextVideo();
                      }

                      @Override
                      public void onResponse(Call call, Response response) {
                          fetchAndLaunchNextVideo();
                      }
                  });
              }

              private void fetchAndLaunchNextVideo() {
                  String cookie = CookieManager.getInstance().getCookie(BASE_URL);
                  Request.Builder req = new Request.Builder()
                          .url(BASE_URL + "?api=get_video")
                          .get();

                  if (cookie != null) req.addHeader("Cookie", cookie);

                  httpClient.newCall(req.build()).enqueue(new Callback() {
                      @Override
                      public void onFailure(Call call, IOException e) {}

                      @Override
                      public void onResponse(Call call, Response response) {
                          try {
                              ResponseBody b = response.body();
                              if (b == null) return;
                              JSONObject json = new JSONObject(b.string());

                              if ("success".equals(json.optString("status"))) {
                                  String nextVid = json.optString("id");
                                  int nextTaskId = json.optInt("task_id");

                                  currentVideoId = nextVid;
                                  currentTaskId = nextTaskId;
                                  remainingSeconds = 15;

                                  new Handler(Looper.getMainLooper()).post(() -> {
                                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse("vnd.youtube:" + nextVid));
                                      intent.setPackage("com.google.android.youtube");
                                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                                      try {
                                          startActivity(intent);
                                          showOverlayDirectly();
                                      } catch (Exception ignored) {}
                                  });
                              } else {
                                  stopAutoWatch();
                                  new Handler(Looper.getMainLooper()).post(() -> {
                                      if (overlayView != null) overlayView.setVisibility(View.GONE);
                                      Toast.makeText(getApplicationContext(), "All tasks completed!", Toast.LENGTH_LONG).show();
                                  });
                              }
                          } catch (Exception ignored) {}
                      }
                  });
              }

              @Override
              public void onInterrupt() {
                  pauseTimer();
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  instance = null;
                  pauseTimer();
                  if (overlayView != null && windowManager != null) {
                      try { windowManager.removeView(overlayView); } catch (Exception ignored) {}
                      overlayView = null;
                  }
              }
          }
