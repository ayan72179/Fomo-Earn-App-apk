name: Build Farmo Watch APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python for High-Res App Icon
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install pillow

      - name: Install Android Platform 34 and Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Project Directories
        run: |
          mkdir -p app/src/main/java/com/fomo/earn
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Generate High-Quality 3D Gold & Cyber Purple PNG Icons for All Densities
      - name: Generate Professional HD App Icons
        run: |
          python3 - << 'EOF'
          from PIL import Image, ImageDraw

          def draw_premium_icon(size):
              img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              
              # Outer Obsidian Circle
              draw.ellipse((0, 0, size, size), fill=(12, 5, 31, 255))
              
              # Electric Violet Ring
              pad1 = int(size * 0.05)
              draw.ellipse((pad1, pad1, size - pad1, size - pad1), fill=(124, 58, 237, 255))
              
              # Deep Cyber Purple Core
              pad2 = int(size * 0.09)
              draw.ellipse((pad2, pad2, size - pad2, size - pad2), fill=(18, 9, 47, 255))
              
              # 24k Gold Outer Badge
              pad3 = int(size * 0.16)
              draw.ellipse((pad3, pad3, size - pad3, size - pad3), fill=(245, 158, 11, 255))
              
              # Bright Gold Inner Coin Face
              pad4 = int(size * 0.20)
              draw.ellipse((pad4, pad4, size - pad4, size - pad4), fill=(251, 191, 36, 255))
              
              # 3D Deep Purple Triangle (Play Symbol)
              tri_pts = [
                  (int(size * 0.42), int(size * 0.35)),
                  (int(size * 0.68), int(size * 0.50)),
                  (int(size * 0.42), int(size * 0.65))
              ]
              draw.polygon(tri_pts, fill=(18, 9, 47, 255))
              
              # Pure White Inner Accent
              tri_inner = [
                  (int(size * 0.44), int(size * 0.39)),
                  (int(size * 0.64), int(size * 0.50)),
                  (int(size * 0.44), int(size * 0.61))
              ]
              draw.polygon(tri_inner, fill=(255, 255, 255, 255))
              return img

          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, s in densities.items():
              icon = draw_premium_icon(s)
              icon.save(f"app/src/main/res/{folder}/ic_launcher.png")
          
          # Also save as high-res drawable
          draw_premium_icon(192).save("app/src/main/res/drawable/ic_logo.png")
          EOF

      - name: Generate Project Configuration and Source Files
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FARMO EARN"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.fomo.earn'
              compileSdk 34

              defaultConfig {
                  applicationId "com.fomo.earn"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_floating_pill.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#EB5824C4" />
              <corners android:radius="24dp" />
              <stroke android:width="1.5dp" android:color="#A78BFA" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Farmo Earn</string>
              <string name="accessibility_service_desc">Farmo Earn Watch Assistant tracks assigned YouTube playback and validates watch duration.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_service_desc"
              android:notificationTimeout="80"
              android:packageNames="com.google.android.youtube" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_splash.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0C051F">

              <LinearLayout
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_centerInParent="true"
                  android:gravity="center"
                  android:orientation="vertical">

                  <ImageView
                      android:layout_width="100dp"
                      android:layout_height="100dp"
                      android:src="@drawable/ic_logo" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:text="FARMO EARN"
                      android:textColor="#FFFFFF"
                      android:textSize="24sp"
                      android:textStyle="bold"
                      android:letterSpacing="0.08" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:text="Automated Video Earning Bot"
                      android:textColor="#A78BFA"
                      android:textSize="12sp" />
              </LinearLayout>
          </RelativeLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0C051F">

              <WebView
                  android:id="@+id/mainWebView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </RelativeLayout>
          EOF

          # Sleek Floating Countdown Pill on YouTube (Top-Center Reverse Countdown)
          cat << 'EOF' > app/src/main/res/layout/overlay_timer.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/overlayRoot"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:background="@drawable/bg_floating_pill"
              android:paddingStart="18dp"
              android:paddingTop="7dp"
              android:paddingEnd="18dp"
              android:paddingBottom="7dp"
              android:orientation="horizontal"
              android:gravity="center"
              android:elevation="24dp">

              <TextView
                  android:id="@+id/tvPillText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="15s"
                  android:textColor="#FFFFFF"
                  android:textSize="14sp"
                  android:textStyle="bold" />
          </LinearLayout>
          EOF

          # Strict Permissions Setup Screen
          cat << 'EOF' > app/src/main/res/layout/activity_permission_setup.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0C051F"
              android:orientation="vertical"
              android:padding="24dp">

              <TextView
